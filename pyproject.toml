[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termite"
version = "1.1.0"
description = "High-performance document compressor and structuring tool for LLM ingestion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Termite Team"}
]
keywords = [
    "document",
    "compression",
    "llm",
    "rag",
    "markdown",
    "nlp",
    "deduplication",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
    "pytest-cov>=4.0",
    "black>=26.5.1",
    "ruff>=0.1.0",
]
stemming = [
    "nltk>=3.8",
]
marker = [
    "marker-pdf>=1.0.0",
]
cloud = [
    "datalab>=1.0.0",
]
spacy = [
    "spacy>=3.0",
]
all = [
    "termite[dev,marker,cloud,spacy,stemming]",
]

[project.urls]
Homepage = "https://github.com/noguerol/termite"
Documentation = "https://github.com/noguerol/termite/tree/main/docs"
Repository = "https://github.com/noguerol/termite"
Issues = "https://github.com/noguerol/termite/issues"
Changelog = "https://github.com/noguerol/termite/blob/main/CHANGELOG.md"

[project.scripts]
termite = "termite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termite = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit, deterministic rule selection for CI.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplifications
    "PIE", # misc improvements
    "RUF", # ruff-specific
    "S",   # bandit-style security checks
    "BLE", # blind-except hygiene (intentional broad catches carry noqa)
]
ignore = [
    "S110",  # try/except/pass fallbacks are deliberate (with debug logging)
    "S105",  # false positives on "unknown"-style sentinel values
    "S104",  # 0.0.0.0 binding does not apply (library/CLI, no server binds)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
